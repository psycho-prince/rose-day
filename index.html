<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Rose Day</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="stage">

    <!-- REAL ROSE (NO DOWNLOAD REQUIRED) -->
    <div id="roseContainer" class="rose-container">
      <img
        id="rose"
        alt="Red Rose"
        src="rose.jpg"
      >
      <span>Tap the rose</span>
    </div>

    <!-- MESSAGE -->
    <div id="messageBox" class="message hidden">
      <h1 id="message"></h1>
      <button onclick="location.reload()">Replay</button>
    </div>

  </main>

  <!-- Petal layer -->
  <div id="petals"></div>

  <script src="script.js"></script>
</body>
</html>
