<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Rose Day</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="stage">

    <!-- HERO ROSE -->
    <div id="roseContainer" class="rose-container">

      <!-- REAL ROSE IMAGE (STABLE SOURCE) -->
      <img
        id="rose"
        alt="Red Rose"
        loading="eager"
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/f/f6/Rose_flower.jpg/512px-Rose_flower.jpg"
        onerror="this.style.display='none';document.getElementById('fallback').style.display='block';"
      />

      <!-- FALLBACK (never broken UI) -->
      <div id="fallback" style="display:none;font-size:64px;">🌹</div>

      <span>Tap the rose</span>
    </div>

    <!-- MESSAGE -->
    <div id="messageBox" class="message hidden">
      <h1 id="message"></h1>
      <button onclick="location.reload()">Replay</button>
    </div>

  </main>

  <div id="petals"></div>

  <script src="script.js"></script>
</body>
</html>
